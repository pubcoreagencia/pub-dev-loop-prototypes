<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pato de Minas - Sistema de Gestão</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>🦆 Pato de Minas</h1>
            <p>Sistema de Gestão de Patos</p>
        </div>
    </header>

    <nav>
        <div class="container">
            <button class="nav-btn active" data-tab="cadastro">+Cadastrar Pato</button>
            <button class="nav-btn" data-tab="lista">Lista de Patos</button>
            <button class="nav-btn" data-tab="estatisticas">Estatísticas</button>
        </div>
    </nav>

    <main class="container">
        <!-- Aba de Cadastro -->
        <section id="cadastro" class="tab-content active">
            <h2>Cadastre um Novo Pato</h2>
            <form id="formPato">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nome">Nome do Pato *</label>
                        <input type="text" id="nome" required>
                    </div>
                    <div class="form-group">
                        <label for="raca">Raça *</label>
                        <input type="text" id="raca" required>
                    </div>
                    <div class="form-group">
                        <label for="idade">Idade (meses) *</label>
                        <input type="number" id="idade" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="genero">Gênero *</label>
                        <select id="genero" required>
                            <option value="">Selecione</option>
                            <option value="Macho">Macho</option>
                            <option value="Fêmea">Fêmea</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="peso">Peso (kg) *</label>
                        <input type="number" id="peso" step="0.1" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="saude">Estado de Saúde *</label>
                        <select id="saude" required>
                            <option value="">Selecione</option>
                            <option value="Saudável">Saudável</option>
                            <option value="Em tratamento">Em tratamento</option>
                            <option value="Doente">Doente</option>
                            <option value="Recuperando">Recuperando</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="observacoes">Observações</label>
                    <textarea id="observacoes" rows="3" placeholder="Informações adicionais sobre o pato..."></textarea>
                </div>
                <button type="submit" class="btn-primary">Cadastrar Pato</button>
            </form>
        </section>

        <!-- Aba de Lista -->
        <section id="lista" class="tab-content">
            <div class="lista-header">
                <h2>Lista de Patos</h2>
                <div class="filtros">
                    <input type="text" id="busca" placeholder="Buscar por nome ou raça...">
                    <select id="filtroSaude">
                        <option value="">Todos os estados</option>
                        <option value="Saudável">Saudável</option>
                        <option value="Em tratamento">Em tratamento</option>
                        <option value="Doente">Doente</option>
                        <option value="Recuperando">Recuperando</option>
                    </select>
                </div>
            </div>
            <div id="listaPatos" class="cards-container">
            </div>
        </section>

        <!-- Aba de Estatísticas -->
        <section id="estatisticas" class="tab-content">
            <h2>Estatísticas do Rebanho</h2>
            <div class="estatisticas-grid">
                <div class="stat-card">
                    <h3>Total de Patos</h3>
                    <span class="stat-value" id="statTotal">0</span>
                </div>
                <div class="stat-card">
                    <h3>Saudáveis</h3>
                    <span class="stat-value" id="statSaudaveis">0</span>
                </div>
                <div class="stat-card">
                    <h3>Em Tratamento</h3>
                    <span class="stat-value" id="statTratamento">0</span>
                </div>
                <div class="stat-card">
                    <h3>Idade Média</h3>
                    <span class="stat-value" id="statIdadeMedia">0</span>
                    <span class="stat-unit">meses</span>
                </div>
            </div>
            <div class="chart-container">
                <h3>Distribuição por Raça</h3>
                <div id="distribuicaoRaca" class="chart-bars">
                </div>
            </div>
        </section>
    </main>

    <!-- Modal de Edição -->
    <div id="modalEdicao" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Editar Pato</h2>
            <form id="formEdicao">
                <input type="hidden" id="editId">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="editNome">Nome *</label>
                        <input type="text" id="editNome" required>
                    </div>
                    <div class="form-group">
                        <label for="editRaca">Raça *</label>
                        <input type="text" id="editRaca" required>
                    </div>
                    <div class="form-group">
                        <label for="editIdade">Idade (meses) *</label>
                        <input type="number" id="editIdade" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="editGenero">Gênero *</label>
                        <select id="editGenero" required>
                            <option value="">Selecione</option>
                            <option value="Macho">Macho</option>
                            <option value="Fêmea">Fêmea</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="editPeso">Peso (kg) *</label>
                        <input type="number" id="editPeso" step="0.1" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="editSaude">Estado de Saúde *</label>
                        <select id="editSaude" required>
                            <option value="">Selecione</option>
                            <option value="Saudável">Saudável</option>
                            <option value="Em tratamento">Em tratamento</option>
                            <option value="Doente">Doente</option>
                            <option value="Recuperando">Recuperando</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="editObservacoes">Observações</label>
                    <textarea id="editObservacoes" rows="3"></textarea>
                </div>
                <button type="submit" class="btn-primary">Atualizar Pato</button>
            </form>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>Pató de Minas &copy; 2024 - Sistema de Gestão de Patos</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
