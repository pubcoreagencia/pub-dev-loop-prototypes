<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedreiro App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>🧱 Pedreiro App</h1>
        <p>Controle de obras e materiais</p>
    </header>

    <nav>
        <button class="nav-btn active" data-tab="dashboard">Dashboard</button>
        <button class="nav-btn" data-tab="materiais">Materiais</button>
        <button class="nav-btn" data-tab="calc">Calculadora</button>
        <button class="nav-btn" data-tab="tarefas">Tarefas</button>
    </nav>

    <main>
        <!-- Dashboard -->
        <section id="dashboard" class="tab-content active">
            <h2>Resumo da Obra</h2>
            <div class="cards">
                <div class="card">
                    <h3>Projetos</h3>
                    <span id="countProjetos">0</span>
                </div>
                <div class="card">
                    <h3>Materiais</h3>
                    <span id="countMateriais">0</span>
                </div>
                <div class="card">
                    <h3>Tarefas Pendentes</h3>
                    <span id="countPendentes">0</span>
                </div>
            </div>
            <div id="proximasTarefas">
                <h3>Próximas Tarefas</h3>
                <ul id="listaProximas"></ul>
            </div>
        </section>

        <!-- Materiais -->
        <section id="materiais" class="tab-content">
            <h2>Controle de Materiais</h2>
            <div class="form-group">
                <input type="text" id="materialNome" placeholder="Nome do material">
                <input type="number" id="materialQtd" placeholder="Quantidade" step="0.1">
                <input type="text" id="materialUnidade" placeholder="Unidade (ex: m³, kg, un)">
                <button id="addMaterial">Adicionar</button>
            </div>
            <table id="tabelaMateriais">
                <thead>
                    <tr>
                        <th>Material</th>
                        <th>Quantidade</th>
                        <th>Unidade</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="materiaisBody"></tbody>
            </table>
        </section>

        <!-- Calculadora -->
        <section id="calc" class="tab-content">
            <h2>Calculadora de Materiais</h2>
            <div class="calc-grid">
                <div class="calc-card">
                    <h3>Concreto (laje)</h3>
                    <label>Comprimento (m):</label>
                    <input type="number" id="cLargura" step="0.1">
                    <label>Largura (m):</label>
                    <input type="number" id="cComprimento" step="0.1">
                    <label>Espessura (cm):</label>
                    <input type="number" id="cEspessura" step="1">
                    <button id="calcConcreto">Calcular</button>
                    <div id="resConcreto"></div>
                </div>
                <div class="calc-card">
                    <h3>Área (Piso / Azulejo)</h3>
                    <label>Comprimento (m):</label>
                    <input type="number" id="aLargura" step="0.1">
                    <label>Largura (m):</label>
                    <input type="number" id="aComprimento" step="0.1">
                    <button id="calcArea">Calcular Área</button>
                    <div id="resArea"></div>
                </div>
                <div class="calc-card">
                    <h3>Tinta</h3>
                    <label>Área (m²):</label>
                    <input type="number" id="tArea" step="0.1">
                    <label>Demão:</label>
                    <select id="tDemao">
                        <option value="2">2 demãos</option>
                        <option value="3">3 demãos</option>
                    </select>
                    <button id="calcTinta">Calcular Tinta</button>
                    <div id="resTinta"></div>
                </div>
            </div>
        </section>

        <!-- Tarefas -->
        <section id="tarefas" class="tab-content">
            <h2>Tarefas</h2>
            <div class="form-group">
                <input type="text" id="tarefaNome" placeholder="Descrição da tarefa">
                <input type="date" id="tarefaData">
                <button id="addTarefa">Adicionar</button>
            </div>
            <ul id="listaTarefas"></ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
